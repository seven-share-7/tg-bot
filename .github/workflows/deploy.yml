# GitHub Actions 自动部署到 Cloudflare Workers
# 
# 当代码推送到 main 分支时自动部署
# 
# @author seven
# @since 2025-11-28

name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
        
      # 2. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      # 3. 安装依赖
      - name: Install dependencies
        run: npm ci
        
      # 4. 生成 Prisma Client
      - name: Generate Prisma Client
        run: npm run db:generate
        
      # 5. 类型检查和构建
      - name: Type check and build
        run: npm run build
        
      # 6. 部署到 Cloudflare Workers
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          
      # 7. 自动设置 Telegram Webhook（调用管理端点）
      - name: Setup Telegram Webhook
        if: success()
        run: |
          echo "⏳ 等待 Worker 完全就绪..."
          sleep 5
          
          echo "📡 调用 Webhook 设置端点..."
          WEBHOOK_URL="${{ secrets.WEBHOOK_URL }}"
          
          if [ -z "$WEBHOOK_URL" ]; then
            WEBHOOK_URL="https://amitgbot.undream.love"
            echo "💡 使用默认 Webhook URL: $WEBHOOK_URL"
          fi
          
          # 调用管理端点设置 Webhook
          RESPONSE=$(curl -s -w "\n%{http_code}" "${WEBHOOK_URL}/setup-webhook")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "HTTP 状态码: $HTTP_CODE"
          echo "响应内容: $BODY"
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Webhook 设置成功！"
            echo "$BODY" | jq '.'
          else
            echo "⚠️  Webhook 设置失败（HTTP $HTTP_CODE）"
            echo "💡 你可以手动访问: ${WEBHOOK_URL}/setup-webhook"
            echo "📋 或者查看日志: wrangler tail"
          fi
          
      # 8. 验证 Webhook 状态
      - name: Verify Webhook Status
        if: success()
        run: |
          echo "🔍 验证 Webhook 状态..."
          WEBHOOK_URL="${{ secrets.WEBHOOK_URL }}"
          
          if [ -z "$WEBHOOK_URL" ]; then
            WEBHOOK_URL="https://amitgbot.undream.love"
          fi
          
          sleep 2
          RESPONSE=$(curl -s "${WEBHOOK_URL}/webhook-info")
          
          echo "Webhook 信息:"
          echo "$RESPONSE" | jq '.' || echo "$RESPONSE"
          
      # 9. 部署成功通知
      - name: Deployment success
        if: success()
        run: |
          echo "🎉 部署成功！"
          echo "✅ Worker 已更新到最新版本"
          echo "💡 请确保在 Cloudflare Dashboard 中配置了所有必需的环境变量"
          echo "🔗 Cloudflare Dashboard: https://dash.cloudflare.com"
          
      # 10. 部署失败通知
      - name: Deployment failed
        if: failure()
        run: |
          echo "❌ 部署失败，请检查日志"

