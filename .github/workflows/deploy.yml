# GitHub Actions 自动部署到 Cloudflare Workers
# 
# 当代码推送到 main 分支时自动部署
# 
# @author seven
# @since 2025-11-28

name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
        
      # 2. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      # 3. 安装依赖
      - name: Install dependencies
        run: npm ci
        
      # 4. 生成 Prisma Client
      - name: Generate Prisma Client
        run: npm run db:generate
        
      # 5. 类型检查和构建
      - name: Type check and build
        run: npm run build
        
      # 6. 部署到 Cloudflare Workers
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          
      # 7. 部署成功提示
      - name: Deployment Complete
        if: success()
        run: |
          echo "🎉 部署成功！"
          echo "✅ Worker 已更新到最新版本"
          echo ""
          echo "📝 接下来的步骤："
          echo "1️⃣  访问 https://amitgbot.undream.love/health 验证服务运行"
          echo "2️⃣  在 Telegram 向 Bot 发送 /start 测试"
          echo "3️⃣  Bot 会在首次收到消息时自动设置 Webhook"
          echo ""
          echo "💡 提示："
          echo "   - Webhook 会在第一次 Telegram 消息时自动配置"
          echo "   - 或手动访问（需通过 Cloudflare 验证）: https://amitgbot.undream.love/setup-webhook"
          echo "   - 查看 Webhook 状态: https://amitgbot.undream.love/webhook-info"
          
      # 8. 部署失败通知
      - name: Deployment success
        if: success()
        run: |
          echo "🎉 部署成功！"
          echo "✅ Worker 已更新到最新版本"
          echo "💡 请确保在 Cloudflare Dashboard 中配置了所有必需的环境变量"
          echo "🔗 Cloudflare Dashboard: https://dash.cloudflare.com"
          
      # 9. 部署失败通知
      - name: Deployment failed
        if: failure()
        run: |
          echo "❌ 部署失败，请检查日志"

